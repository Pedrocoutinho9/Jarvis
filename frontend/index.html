<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap">
<style>
:root{--bg:#02060f;--blue:#2f7bff;--cyan:#7fdcff;--text:#dbe8ff;--dim:#7f97c4;--panel:rgba(9,20,46,.78);--line:rgba(127,220,255,.18)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse 65% 55% at 50% 36%,#08173d 0%,var(--bg) 72%);color:var(--text);font-family:"Chakra Petch",system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
background-image:linear-gradient(rgba(127,220,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(127,220,255,.035) 1px,transparent 1px);background-size:56px 56px;
-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 70%)}
#stage{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;justify-items:center;padding:22px 20px 18px;overflow:auto}
#status{font-size:.95rem;letter-spacing:.3em;text-indent:.3em;color:var(--cyan);opacity:.85}
#orb{width:min(40vh,70vw);height:min(40vh,70vw);align-self:center}
#feature{width:100%;min-height:32vh;display:flex;justify-content:center;align-items:flex-start}
#caption{min-height:2.6em;max-width:780px;text-align:center;font-size:clamp(1rem,2vw,1.35rem);padding-top:10px}

.feature{width:min(560px,90vw);background:var(--panel);border:1px solid rgba(127,220,255,.3);border-radius:16px;padding:22px 24px;box-shadow:0 0 60px rgba(47,123,255,.2);backdrop-filter:blur(10px)}
.f-head{display:flex;align-items:center;gap:10px;color:var(--cyan);margin-bottom:6px}
.f-head .ico{width:28px;height:28px}
.f-head small{font-size:.85rem;color:var(--dim)}
.feature h2{font-size:1.6rem;margin-bottom:12px}
.feature img{display:block;width:100%;max-height:18vh;object-fit:cover;border-radius:10px;margin-bottom:12px}
.f-body{font-size:1.05rem;line-height:1.5}
.f-body ul{padding-left:18px}.f-body li{margin-bottom:6px}
.f-body .big{font-size:3.4rem;font-weight:600;line-height:1.1}

.dock{position:absolute;top:50%;transform:translateY(-50%);width:250px;display:flex;flex-direction:column;gap:12px}
#dockL{left:28px}#dockR{right:28px}
.slot{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;opacity:0;transition:opacity .45s;cursor:pointer}
.slot.shown{opacity:1}
.slot:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.slot .ico{flex:none;width:30px;height:30px;color:var(--cyan)}
.slot small{color:var(--dim);font-size:.72rem}
.slot h3{font-size:.95rem;margin:1px 0 3px}
.slot p{font-size:.8rem;line-height:1.35;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
svg{width:100%;height:100%}

#bar{position:fixed;top:14px;right:16px;display:flex;gap:8px;z-index:5}
#ask{background:rgba(9,20,46,.6);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:.8rem;width:200px}
#ask:focus{outline:none;border-color:var(--blue)}
button{background:rgba(9,20,46,.6);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:.8rem;cursor:pointer}
button:hover,button:focus-visible,button.on{color:var(--text);border-color:var(--blue);outline:none}
button.on{background:var(--blue)}

@media (max-width:1100px){.dock{position:static;transform:none;width:100%;flex-direction:row;overflow-x:auto}.slot{flex:0 0 230px}}
@media (prefers-reduced-motion:reduce){.slot{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="status">Em espera</div>
  <canvas id="orb"></canvas>
  <div id="feature"></div>
  <div id="caption" aria-live="polite"></div>
  <aside id="dockL" class="dock"></aside>
  <aside id="dockR" class="dock"></aside>
</div>
<div id="bar">
  <input id="ask" placeholder="Pergunte algo..." autocomplete="off">
  <button id="go">Simular briefing</button>
  <button id="mic">Ativar microfone</button>
</div>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const capEl = $('caption'), micBtn = $('mic');
const LABEL = {espera:'Em espera', ouvindo:'Ouvindo', pensando:'Pensando', falando:'Falando'};
let state = 'espera', amp = 0.04, target = 0.04, speed = 0.15;

// ---- Ícones e helpers
const ICONS = {
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  cloud:'<path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5 4.75 4.75 0 0 1 17.5 18z"/>',
  rain:'<path d="M7 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 5.5 4.75 4.75 0 0 1 17.5 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
  chart:'<path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/>',
  news:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'
};
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ICONS.news}</svg>`;
function mk(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const plain = html => { const t = document.createElement('div'); t.innerHTML = html; return t.textContent.trim(); };
const wait = ms => new Promise(r => setTimeout(r, ms));

// ---- Dados e painéis laterais (começam escondidos; cada card "pousa" quando é falado)
let DATA = [];
function renderSlots(){
  $('dockL').innerHTML = ''; $('dockR').innerHTML = '';
  DATA.forEach(d => {
    const el = mk('article', 'slot'); el.id = 's-' + d.id; el.tabIndex = 0;
    const i = mk('span', 'ico'); i.innerHTML = ico(d.icon);
    const box = mk('div'); box.append(mk('small', '', d.k), mk('h3', '', d.t), mk('p', '', plain(d.html)));
    el.append(i, box);
    el.onclick = () => peek(d);
    el.onkeydown = e => { if (e.key === 'Enter') peek(d); };
    $(d.k === 'Notícias' ? 'dockR' : 'dockL').appendChild(el);
  });
}
async function load(){
  try {
    const r = await fetch('/api/briefing');
    DATA = await r.json();
  } catch (e) {
    DATA = [{id:'erro', icon:'news', k:'Erro', t:'Sem conexão com o backend', html:'<p>Inicie o servidor com uvicorn.</p>', say:'Não consegui falar com o servidor.'}];
  }
  renderSlots();
}
load();

// ---- Card em destaque: aparece na frente do orbe e depois voa para o painel
function buildFeature(d){
  const f = mk('div', 'feature');
  const head = mk('div', 'f-head');
  const i = mk('span', 'ico'); i.innerHTML = ico(d.icon);
  head.append(i, mk('small', '', d.k));
  f.append(head, mk('h2', '', d.t));
  if (d.image){
    const im = new Image(); im.alt = ''; im.referrerPolicy = 'no-referrer';
    im.onerror = () => im.remove(); im.src = d.image; f.appendChild(im);
  }
  const body = mk('div', 'f-body'); body.innerHTML = d.html; f.appendChild(body);
  return f;
}
function showFeature(d){
  const f = buildFeature(d);
  $('feature').appendChild(f);
  f.animate([{opacity:0, transform:'translateY(28px) scale(.9)'}, {opacity:1, transform:'none'}],
            {duration: reduce ? 1 : 480, easing:'cubic-bezier(.2,.8,.2,1)', fill:'backwards'});
  return f;
}
async function dockFeature(f, d){
  const slot = $('s-' + d.id);
  if (!slot){ f.remove(); return; }
  const a = f.getBoundingClientRect(), b = slot.getBoundingClientRect();
  f.style.transformOrigin = '0 0';
  const anim = f.animate([
    {transform:'none', opacity:1},
    {opacity:1, offset:.55},
    {transform:`translate(${b.left - a.left}px,${b.top - a.top}px) scale(${b.width / a.width},${b.height / a.height})`, opacity:0}
  ], {duration: reduce ? 1 : 700, easing:'cubic-bezier(.6,0,.2,1)', fill:'forwards'});
  setTimeout(() => slot.classList.add('shown'), reduce ? 0 : 420);
  try { await anim.finished; } catch (e) {}
  f.remove();
}
let peeking = false;
async function peek(d){ // clicar num painel mostra o card de novo
  if (running || peeking) return; peeking = true;
  const slot = $('s-' + d.id); slot.classList.remove('shown');
  const f = showFeature(d); await wait(4000); await dockFeature(f, d);
  peeking = false;
}

// ---- Estados
function setState(s){
  state = s;
  $('status').textContent = LABEL[s];
  speed = {espera:.15, ouvindo:.3, pensando:1.2, falando:.4}[s];
  target = {espera:.04, ouvindo:.1, pensando:.08, falando:.16}[s];
}
setState('espera');

// ---- Áudio: toca a voz pelo AudioContext e mede o volume para animar o orbe
let actx, analyser, buf, live = false;
function initAudio(){
  if (actx) { actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = actx.createAnalyser(); analyser.fftSize = 256;
  buf = new Uint8Array(analyser.fftSize);
  analyser.connect(actx.destination);
}
async function fetchAudio(text){
  try {
    const r = await fetch('/api/tts?text=' + encodeURIComponent(text));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const ab = await r.arrayBuffer();
    return await new Promise((ok, fail) => actx.decodeAudioData(ab, ok, fail));
  } catch (e) { console.error('TTS falhou:', e); return null; }
}
function play(buffer){
  return new Promise(res => {
    const src = actx.createBufferSource();
    src.buffer = buffer; src.connect(analyser);
    src.onended = () => { live = false; res(); };
    live = true; src.start();
  });
}

// ---- Briefing
let running = false;
async function runBriefing(){
  if (running || peeking || busy) return; running = true;
  pauseRec(); // não deixa o Jarvis ouvir a própria voz
  initAudio(); await actx.resume();
  setState('pensando'); capEl.textContent = 'Preparando seu briefing...';
  await load();
  const urls = await Promise.all(DATA.map(d => fetchAudio(d.say))); // gera todas as falas enquanto "pensa"
  for (let i = 0; i < DATA.length; i++){
    const d = DATA[i];
    setState('falando'); capEl.textContent = d.say;
    const f = showFeature(d);
    try {
      if (!urls[i]) throw new Error('sem áudio');
      await play(urls[i]);
    } catch (e) { live = false; await wait(2800 + d.say.length * 30); } // sem áudio: só legenda
    await wait(350);
    await dockFeature(f, d);
  }
  capEl.textContent = ''; running = false; lastActive = Date.now();
  resumeRec();
  if (!listening) setState('espera');
}
$('go').onclick = () => { initAudio(); runBriefing(); };

// ---- Conversa: pergunta -> /api/chat -> resposta falada
let busy = false, lastActive = 0;
const history = [];
async function converse(q){
  if (running || busy) return; busy = true;
  pauseRec();
  initAudio(); await actx.resume();
  setState('pensando'); capEl.textContent = q;
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages:[...history, {role:'user', content:q}]})});
    if (!r.ok){ const err = await r.json().catch(() => ({})); throw new Error(err.detail || 'Erro ' + r.status); }
    const {reply} = await r.json();
    history.push({role:'user', content:q}, {role:'assistant', content:reply});
    if (history.length > 12) history.splice(0, history.length - 12);
    setState('falando'); capEl.textContent = reply;
    const audio = await fetchAudio(reply);
    if (audio) await play(audio); else await wait(2500 + reply.length * 30);
  } catch (e) {
    live = false; setState('espera'); capEl.textContent = e.message; await wait(4000);
  }
  capEl.textContent = ''; busy = false; lastActive = Date.now();
  resumeRec();
  if (!listening) setState('espera');
}
$('ask').onkeydown = e => {
  const q = e.target.value.trim();
  if (e.key === 'Enter' && q){ initAudio(); e.target.value = ''; converse(q); }
};

// ---- Ouvir: reconhecimento de voz do navegador (Chrome ou Safari)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, paused = false;
function startRec(){
  rec = new SR();
  rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    if (running || busy) return;
    let text = '', final = false;
    for (let i = e.resultIndex; i < e.results.length; i++){
      text += e.results[i][0].transcript;
      if (e.results[i].isFinal) final = true;
    }
    capEl.textContent = text;
    if (/bom dia/i.test(text)){ runBriefing(); return; }
    // perguntas: precisam da palavra "Jarvis" ou vir logo após uma interação (25 s)
    const awake = /jarvis/i.test(text) || Date.now() - lastActive < 25000;
    if (final && awake){
      const q = text.replace(/^\s*(ei |ok |olá )?jarvis[,.!]?\s*/i, '').trim();
      if (q.length > 2) converse(q);
    }
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      stopListening();
      capEl.textContent = 'Permita o uso do microfone nas configurações do navegador.';
    }
  };
  rec.onend = () => { if (listening && !paused) { try { rec.start(); } catch (e) {} } };
  try { rec.start(); } catch (e) {}
}
function pauseRec(){ paused = true; if (rec) try { rec.stop(); } catch (e) {} }
function resumeRec(){ paused = false; if (listening) { startRec(); setState('ouvindo'); } }
function stopListening(){
  listening = false; paused = false;
  if (rec) try { rec.stop(); } catch (e) {}
  micBtn.textContent = 'Ativar microfone'; micBtn.classList.remove('on');
  if (!running) setState('espera');
}
micBtn.onclick = () => {
  if (listening) return stopListening();
  if (!SR){ capEl.textContent = 'Este navegador não suporta reconhecimento de voz. Use Chrome ou Safari.'; return; }
  initAudio(); // libera o áudio enquanto há um clique do usuário
  listening = true;
  micBtn.textContent = 'Desativar microfone'; micBtn.classList.add('on');
  capEl.textContent = 'Diga "bom dia"';
  setState('ouvindo'); startRec();
};

// ---- Orbe (canvas)
const cv = $('orb'), ctx = cv.getContext('2d');
const RINGS = Array.from({length:9}, (_, i) => ({ph:Math.random()*6.28, tilt:Math.random()*3.14, k:2+Math.floor(Math.random()*4), r:.62+Math.random()*.3, w:i%3+1}));
let t = 0, env = 0;
function resize(){ const d = devicePixelRatio || 1, s = cv.clientWidth; cv.width = cv.height = s * d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();
function frame(){
  const s = cv.clientWidth, c = s / 2;
  t += (reduce ? 0 : speed) * 0.016;
  if (live) {
    analyser.getByteTimeDomainData(buf);
    let sum = 0; for (const v of buf){ const x = (v - 128) / 128; sum += x * x; }
    env = Math.min(1, Math.sqrt(sum / buf.length) * 4);
  } else if (state === 'falando' && Math.random() < .12) env = Math.random();
  amp += (target * (state === 'falando' ? .5 + env : 1) - amp) * .08;
  ctx.clearRect(0, 0, s, s);
  ctx.globalCompositeOperation = 'lighter';
  RINGS.forEach((g, i) => {
    ctx.beginPath();
    for (let a = 0; a <= 6.3; a += .04){
      const wob = Math.sin(a * g.k + t * (1 + i * .15) + g.ph) * amp + Math.sin(a * 2 - t + g.ph) * amp * .5;
      const r = (g.r + wob) * c * .95;
      const x = Math.cos(a) * r, y = Math.sin(a) * r * (.75 + .25 * Math.cos(g.tilt + t * .3));
      const rx = x * Math.cos(g.tilt) - y * Math.sin(g.tilt), ry = x * Math.sin(g.tilt) + y * Math.cos(g.tilt);
      a ? ctx.lineTo(c + rx, c + ry) : ctx.moveTo(c + rx, c + ry);
    }
    ctx.strokeStyle = `rgba(${60 + i * 8},${140 + i * 8},255,${.35 + g.w * .1})`;
    ctx.lineWidth = g.w * .6; ctx.shadowColor = '#2f7bff'; ctx.shadowBlur = 12; ctx.stroke();
  });
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
